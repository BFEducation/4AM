<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173e30">
  <meta name="description" content="Un jeu interactif de révision en français pour découvrir les lieux touristiques d’Algérie et apprendre à défendre son point de vue.">
  <meta property="og:title" content="Le carnet du jeune guide — Faisons découvrir l’Algérie !">
  <meta property="og:description" content="Un jeu de révision interactif en cinq étapes pour les élèves de 4e année moyenne.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://commons.wikimedia.org/wiki/Special:FilePath/View_of_Tipasa_01.jpg?width=1200">
  <meta property="og:image:alt" content="Photographie du site romain de Tipasa près de la mer.">
  <title>Le carnet du jeune guide — Faisons découvrir l’Algérie !</title>
  <style>
    :root {
      --forest: #173e30;
      --forest-2: #245b43;
      --leaf: #527a59;
      --sand: #f4efe3;
      --paper: #fffdf8;
      --ink: #21342b;
      --muted: #65746a;
      --line: #dcdacc;
      --clay: #b55f3d;
      --gold: #e2bd71;
      --pale-green: #e9f0e8;
      --pale-clay: #f8e9e1;
      --shadow: 0 14px 38px rgba(28, 48, 36, .09);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--sand);
      color: var(--ink);
      font: 16px/1.58 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, select, textarea, input { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--forest-2); }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px max(22px, calc((100vw - 1190px) / 2));
      color: white;
      background: var(--forest);
      box-shadow: 0 4px 16px rgba(15, 39, 28, .18);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      border: 0;
      padding: 0;
      color: inherit;
      background: transparent;
      font-weight: 780;
      letter-spacing: .01em;
      text-align: left;
    }
    .brand-mark {
      width: 35px;
      height: 35px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 50% 50% 50% 14px;
      color: var(--forest);
      background: var(--gold);
      font-family: Georgia, serif;
      font-size: 18px;
    }
    .brand small { display: block; color: #d8e5dc; font-size: 11px; font-weight: 600; line-height: 1.2; }
    .teacher {
      flex: 0 0 auto;
      padding: 7px 12px;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 999px;
      color: white;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }
    .sound-toggle {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,.32);
      border-radius: 50%;
      color: white;
      background: rgba(255,255,255,.1);
      font-size: 17px;
      line-height: 1;
    }
    .sound-toggle:hover { background: rgba(255,255,255,.2); }
    .sound-toggle[aria-pressed="false"] { color: #d5ded6; background: transparent; }
    .score-pill {
      flex: 0 0 auto;
      min-width: 74px;
      padding: 7px 12px;
      border-radius: 999px;
      color: #1b3428;
      background: #f3e7c9;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }
    main { min-height: 70vh; }
    .wrap { width: min(1160px, calc(100% - 40px)); margin: 0 auto; }
    .hero {
      position: relative;
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      align-items: center;
      gap: 30px;
      padding: 56px 0 34px;
    }
    .eyebrow, .section-kicker {
      color: var(--clay);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { color: var(--forest); }
    h1, h2 { font-family: Georgia, "Times New Roman", serif; }
    h1 { margin: 9px 0 16px; font-size: clamp(37px, 5.4vw, 65px); line-height: 1.04; letter-spacing: -.035em; }
    h1 span { color: var(--clay); }
    h2 { margin-bottom: 12px; font-size: clamp(28px, 3.6vw, 41px); line-height: 1.14; }
    h3 { margin-bottom: 8px; font-family: Georgia, serif; font-size: 22px; line-height: 1.2; }
    .lede { max-width: 630px; color: #43584b; font-size: 18px; }
    .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 11px; margin: 22px 0 14px; }
    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      min-height: 47px;
      padding: 11px 18px;
      border: 1px solid var(--forest);
      border-radius: 999px;
      color: white;
      background: var(--forest);
      font-weight: 800;
      line-height: 1.2;
      text-decoration: none;
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    }
    .button:hover { transform: translateY(-1px); background: var(--forest-2); box-shadow: 0 7px 18px rgba(23,62,48,.18); }
    .button:focus-visible, button:focus-visible, a:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible {
      outline: 3px solid #d89b52;
      outline-offset: 3px;
    }
    .button.secondary { border-color: var(--line); color: var(--forest); background: var(--paper); }
    .button.secondary:hover { background: white; }
    .button.clay { border-color: var(--clay); background: var(--clay); }
    .button:disabled { cursor: not-allowed; border-color: #bcbdb4; color: #747a73; background: #e5e5de; box-shadow: none; transform: none; }
    .plain-button { border: 0; padding: 6px; color: var(--forest-2); background: transparent; font-weight: 750; text-decoration: underline; text-underline-offset: 3px; }
    .fineprint { color: var(--muted); font-size: 13px; }
    .landmark-gallery {
      position: relative;
      overflow: hidden;
      height: 355px;
      display: grid;
      grid-template-columns: 1.18fr .82fr;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      padding: 8px;
      border: 1px solid #e1d7c2;
      border-radius: 30px 30px 30px 9px;
      background: #e8e0ce;
      box-shadow: var(--shadow);
    }
    .gallery-photo {
      position: relative;
      overflow: hidden;
      min-width: 0;
      margin: 0;
      border-radius: 17px;
      background: #d8d2c2;
    }
    .gallery-photo.gallery-main { grid-row: 1 / 3; }
    .gallery-photo img { width: 100%; height: 100%; display: block; object-fit: cover; transition: transform .35s ease; }
    .gallery-photo:hover img { transform: scale(1.025); }
    .gallery-photo figcaption {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      gap: 2px;
      padding: 31px 10px 9px;
      color: white;
      background: linear-gradient(transparent, rgba(12,34,25,.88));
      font-size: 10px;
      line-height: 1.35;
    }
    .gallery-photo figcaption strong { font-family: Georgia, serif; font-size: 16px; }
    .gallery-photo figcaption a { color: white; text-decoration-thickness: 1px; }
    .gallery-photo:not(.gallery-main) figcaption { padding: 25px 8px 7px; font-size: 9px; }
    .gallery-photo:not(.gallery-main) figcaption strong { font-size: 13px; }
    .gallery-badge {
      position: absolute;
      z-index: 2;
      top: 17px;
      left: 17px;
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,.6);
      border-radius: 99px;
      color: white;
      background: rgba(23,62,48,.82);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .route-summary {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .route-dots { display: flex; gap: 4px; }
    .route-dots i { width: 8px; height: 8px; display: block; border-radius: 50%; background: var(--clay); }
    .route-dots i:nth-child(even) { background: var(--forest-2); }
    .welcome-card, .paper-card, .question-card, .writing-card, .result-card, .reading-card {
      border: 1px solid rgba(52,77,60,.12);
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .welcome-card { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: center; padding: 21px 24px; }
    .welcome-card p:last-child { margin-bottom: 0; }
    .welcome-tag { color: var(--forest); font-weight: 800; }
    .section { padding: 42px 0; }
    .section-heading { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 18px; }
    .section-heading p { max-width: 560px; margin-bottom: 0; color: var(--muted); }
    .destination-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .destination-card { overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); }
    .destination-card figure { margin: 0; }
    .destination-card img { width: 100%; height: 160px; display: block; object-fit: cover; background: #d6d0c0; }
    .destination-card figcaption { padding: 10px 12px 0; color: #66756a; font-size: 10px; line-height: 1.4; }
    .destination-copy { padding: 11px 13px 15px; }
    .destination-copy h3 { margin-bottom: 4px; font-size: 18px; }
    .destination-copy p { margin-bottom: 7px; color: #465a4d; font-size: 13px; line-height: 1.48; }
    .destination-region { display: inline-block; margin-bottom: 6px; color: var(--clay); font-size: 10px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    .source-link { color: var(--forest-2); font-size: 11px; font-weight: 750; text-decoration: underline; }
    .learning-path { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .path-card { min-height: 132px; padding: 15px; border-top: 3px solid var(--leaf); border-radius: 5px 5px 14px 14px; background: #e8eee6; }
    .path-card b { display: block; margin: 5px 0; color: var(--forest); font-family: Georgia, serif; font-size: 17px; }
    .path-card span { color: #5f7064; font-size: 12px; }
    .path-number { color: var(--clay); font-size: 12px; font-weight: 900; }
    .footer { margin-top: 40px; padding: 32px 0 40px; border-top: 1px solid #d5d1c5; color: #536358; background: rgba(255,253,248,.45); font-size: 13px; }
    .footer h2 { font-size: 23px; }
    .footer-links { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 10px 0 16px; }
    .footer small { display: block; max-width: 820px; }
    details.credits { margin-top: 10px; }
    details.credits summary { color: var(--forest); cursor: pointer; font-weight: 800; }
    .journey-head { padding: 29px 0 8px; }
    .journey-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    .step-track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 0 0 26px; }
    .step-stop { position: relative; display: flex; align-items: center; gap: 8px; min-width: 0; padding: 8px 6px; border: 0; color: #738176; background: transparent; text-align: left; }
    .step-stop::before { content: ""; position: absolute; top: 20px; left: 25px; right: -7px; height: 2px; background: #d2d8ce; z-index: 0; }
    .step-stop:last-child::before { display: none; }
    .step-stop.done::before { background: var(--leaf); }
    .stop-dot { position: relative; z-index: 1; width: 25px; height: 25px; display: grid; place-items: center; flex: 0 0 auto; border: 1px solid #bbc5b9; border-radius: 50%; color: #66766b; background: var(--sand); font-size: 11px; font-weight: 850; }
    .step-stop.current .stop-dot, .step-stop.done .stop-dot { border-color: var(--forest); color: white; background: var(--forest); }
    .stop-label { overflow: hidden; color: #57675b; font-size: 11px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .step-stop.current .stop-label { color: var(--forest); }
    .stage-title { display: flex; justify-content: space-between; align-items: start; gap: 20px; margin-bottom: 19px; }
    .stage-title h1 { margin: 3px 0 7px; font-size: clamp(31px, 4.7vw, 48px); }
    .stage-title p { max-width: 720px; margin-bottom: 0; color: #536358; }
    .stage-layout { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 20px; align-items: start; padding-bottom: 28px; }
    .reading-card { margin-bottom: 16px; padding: 21px 23px; border-left: 5px solid var(--gold); }
    .reading-card h2 { margin-bottom: 8px; font-family: system-ui, sans-serif; font-size: 17px; }
    .model-text { margin: 0; font-family: Georgia, serif; font-size: 18px; line-height: 1.72; }
    .model-text strong { color: var(--forest); text-decoration: underline; text-decoration-color: #a9c29f; text-decoration-thickness: 3px; text-underline-offset: 3px; }
    .question-card { padding: 21px 23px; }
    .question-count { margin-bottom: 8px; color: var(--clay); font-size: 12px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    .question-title { margin-bottom: 14px; color: var(--forest); font-family: Georgia, serif; font-size: 23px; line-height: 1.28; }
    .answers { display: grid; gap: 9px; }
    .answer-option {
      width: 100%;
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 12px 13px;
      border: 1px solid #d9ddd4;
      border-radius: 12px;
      color: var(--ink);
      background: white;
      text-align: left;
      line-height: 1.45;
    }
    .answer-option:hover:not(:disabled) { border-color: #78927b; background: #f5f8f2; }
    .answer-option:disabled { cursor: default; }
    .answer-letter { width: 24px; height: 24px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; color: var(--forest); background: var(--pale-green); font-size: 12px; font-weight: 850; }
    .form-row { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 12px 0; }
    .match-row { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(155px, .8fr); align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #e6e6df; }
    .match-row label { font-weight: 700; }
    select, input[type="text"], textarea {
      width: 100%;
      border: 1px solid #bcc8bb;
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--ink);
      background: white;
    }
    .sentence-gap { display: inline-block; min-width: 135px; width: auto; margin: 0 4px; padding: 5px 9px; vertical-align: baseline; }
    .inline-check { margin-top: 14px; }
    .reorder-list { display: grid; gap: 8px; margin: 14px 0; padding: 0; list-style: none; }
    .reorder-item { display: flex; align-items: center; gap: 10px; min-height: 55px; padding: 9px 10px; border: 1px solid #d9ddd4; border-radius: 12px; background: white; }
    .reorder-item .order-text { flex: 1; font-weight: 650; }
    .move-buttons { display: flex; gap: 5px; }
    .move-buttons button { width: 32px; height: 32px; border: 1px solid #d5d8cf; border-radius: 50%; color: var(--forest); background: #f5f7f2; font-weight: 900; }
    .feedback {
      margin-top: 15px;
      padding: 14px 15px;
      border-radius: 13px;
      font-size: 14px;
    }
    .feedback.good { border: 1px solid #a9c7ad; color: #244933; background: #edf5ed; }
    .feedback.retry { border: 1px solid #e2c49b; color: #614622; background: #fbf2e4; }
    .feedback b { display: block; margin-bottom: 3px; }
    .question-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 11px; margin-top: 16px; }
    .question-hint { color: var(--muted); font-size: 12px; }
    .side-stack { display: grid; gap: 13px; }
    .side-note { padding: 16px; border: 1px solid #d9dfd6; border-radius: 17px; background: #e9efe6; }
    .side-note h3 { margin-bottom: 6px; font-family: system-ui, sans-serif; font-size: 15px; }
    .side-note p, .side-note li { margin-bottom: 4px; color: #506354; font-size: 13px; }
    .side-note ul { margin: 8px 0 0; padding-left: 19px; }
    .side-photo { overflow: hidden; margin: 0; border-radius: 16px; background: #ddd; }
    .side-photo img { width: 100%; height: 165px; display: block; object-fit: cover; }
    .side-photo figcaption { padding: 8px 10px; color: #69766b; background: var(--paper); font-size: 10px; }
    .stage-bottom { display: flex; justify-content: space-between; gap: 12px; padding: 0 0 34px; }
    .mini-progress { height: 7px; overflow: hidden; margin: 4px 0 0; border-radius: 8px; background: #e3e3da; }
    .mini-progress span { height: 100%; display: block; border-radius: inherit; background: var(--leaf); transition: width .25s ease; }
    .writing-card { padding: 22px; }
    .writing-intro { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; margin-bottom: 20px; }
    .writing-intro .writing-example { padding: 14px 16px; border-radius: 14px; color: #334b3b; background: #eff2e9; }
    .writing-example b { color: var(--forest); }
    .guided-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: grid; gap: 5px; }
    .field label { color: #34503e; font-size: 13px; font-weight: 850; }
    .field small { color: var(--muted); font-size: 11px; }
    .field textarea { min-height: 75px; resize: vertical; }
    .field.full { grid-column: 1/-1; }
    .assemble-row { display: flex; align-items: center; flex-wrap: wrap; gap: 11px; margin: 14px 0 19px; }
    .editor-label { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 8px 0 6px; color: var(--forest); font-weight: 850; }
    #finalText { min-height: 190px; resize: vertical; font-size: 16px; line-height: 1.65; }
    .word-count { color: var(--muted); font-size: 12px; font-weight: 700; }
    .rubric-head { display: flex; justify-content: space-between; align-items: end; gap: 15px; margin: 24px 0 10px; }
    .rubric-head h2 { margin-bottom: 4px; font-size: 25px; }
    .rubric-list { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .rubric-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px; border: 1px solid #e1e1d9; border-radius: 12px; background: #fff; }
    .rubric-item input { width: 18px; height: 18px; flex: 0 0 auto; margin: 2px 0 0; accent-color: var(--forest); }
    .rubric-item label { flex: 1; color: #304639; font-size: 13px; font-weight: 750; cursor: pointer; }
    .rubric-tip { display: block; margin-top: 3px; color: #6a786d; font-size: 11px; font-weight: 500; }
    .rubric-status { display: inline-block; margin-top: 5px; padding: 2px 7px; border-radius: 999px; color: #536358; background: #efefe8; font-size: 10px; font-weight: 850; }
    .rubric-status.found { color: #24543a; background: #e4f1e5; }
    .writing-note { margin-top: 13px; padding: 12px 14px; border-radius: 12px; color: #5f4a31; background: #f9f0df; font-size: 13px; }
    .results-hero { margin: 30px 0 20px; padding: 28px; border-radius: 27px; color: white; background: var(--forest); }
    .results-hero h1 { color: white; font-size: clamp(34px, 5vw, 52px); }
    .results-hero p { margin-bottom: 0; color: #e0ebe1; font-size: 17px; }
    .results-score { display: inline-flex; align-items: baseline; gap: 6px; margin-top: 16px; padding: 8px 15px; border-radius: 99px; color: var(--forest); background: var(--gold); font-weight: 900; }
    .results-score strong { font-family: Georgia, serif; font-size: 28px; }
    .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
    .result-card { padding: 20px; }
    .result-card h2 { margin-bottom: 10px; font-size: 25px; }
    .result-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .result-list li { display: flex; gap: 8px; align-items: start; color: #425448; }
    .tick { color: #397049; font-weight: 900; }
    .review { color: #8a5533; }
    .saved-writing { padding: 16px; border-left: 4px solid var(--gold); border-radius: 8px; background: white; white-space: pre-wrap; }
    .result-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 34px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
    @media (max-width: 900px) {
      .destination-grid { grid-template-columns: repeat(2, 1fr); }
      .stage-layout { grid-template-columns: minmax(0, 1fr) 245px; gap: 14px; }
      .learning-path { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 680px) {
      .topbar { min-height: 60px; gap: 7px; padding: 8px 12px; }
      .brand { gap: 7px; font-size: 12px; line-height: 1.15; }
      .brand small { font-size: 9px; }
      .brand-mark { width: 31px; height: 31px; font-size: 15px; }
      .teacher { padding: 6px 8px; font-size: 10px; letter-spacing: -.025em; }
      .score-pill { min-width: auto; padding: 6px 8px; font-size: 11px; }
      .wrap { width: min(100% - 26px, 560px); }
      .hero { grid-template-columns: 1fr; gap: 17px; padding-top: 34px; }
      .hero .lede { font-size: 16px; }
      .landmark-gallery { height: 280px; }
      .welcome-card { grid-template-columns: 1fr; padding: 18px; gap: 7px; }
      .section { padding: 31px 0; }
      .section-heading { display: block; }
      .section-heading p { margin-top: 6px; }
      .destination-grid { gap: 9px; }
      .destination-card img { height: 125px; }
      .destination-copy { padding: 9px 10px 12px; }
      .destination-copy h3 { font-size: 16px; }

        { id: "s1q3", type: "choice", title: "Quelle phrase présente un argument appuyé par une description ?", options: [["a","Je vous invite à visiter la Casbah."],["b","D’abord, ses ruelles étroites serpentent entre des maisons anciennes."],["c","Je vous recommande de la découvrir."]], correct: "b", explanation: "Cette phrase donne une raison de visiter le lieu et la développe avec des détails descriptifs." },

          saveState(); render();
        });
        const orderButton = document.querySelector("[data-check-order]");
        if (orderButton) orderButton.addEventListener("click", () => checkQuestion(q, getOrder(q)));
        document.querySelectorAll("[data-move]").forEach(btn => btn.addEventListener("click", () => {
          const [fromText, deltaText] = btn.dataset.move.split(":");
          const order = getOrder(q);
          const from = Number(fromText), to = from + Number(deltaText);
          if (to < 0 || to >= order.length) return;
          [order[from], order[to]] = [order[to], order[from]];
          state.orders[q.id] = order; saveState(); render();
        }));
        document.querySelectorAll("[data-match]").forEach(el => el.addEventListener("change", () => {
          const selected = [...document.querySelectorAll("[data-match]")].map(x=>x.value);
          state.responses = state.responses || {}; state.responses[q.id] = selected; saveState();
        }));
      }
      const next = document.querySelector("[data-next-question]");
      if (next) next.addEventListener("click", finishQuestion);
      const home = document.getElementById("homeButton");
      if (home) home.addEventListener("click", () => { state.page="home"; saveState(); render(); window.scrollTo(0,0); });
      const prev = document.getElementById("previousStep");
      if (prev) prev.addEventListener("click", () => { state.step=Math.max(0,state.step-1); state.question=0; state.feedback=null; saveState(); render(); window.scrollTo(0,0); });
    }
    function writePlanFromInputs() {
      state.plan.place = document.getElementById("plan-place").value;
      state.plan.intro = document.getElementById("plan-intro").value;
      state.plan.opinion = document.getElementById("plan-opinion").value;
      state.plan.arg1 = document.getElementById("plan-arg1").value;
      state.plan.arg2 = document.getElementById("plan-arg2").value;
      state.plan.end = document.getElementById("plan-end").value;
      saveState();
    }
    function updatePlaceSuggestion() {
      const place = places.find(p => p.key === document.getElementById("plan-place").value);
      const suggestion = document.getElementById("placeSuggestion");
      const button = document.getElementById("usePlaceIntro");
      if (!place) {
        suggestion.textContent = "Choisis un lieu pour voir une idée de localisation.";
        button.hidden = true;
        return;
      }
      suggestion.textContent = "Idée de localisation : " + place.intro;
      button.hidden = false;
    }
    function updateWritingHints() {
      const text = document.getElementById("finalText").value;
      const wc = words(text).length;
      document.getElementById("wordCount").textContent = wc + (wc === 1 ? " mot" : " mots");
      criteria.forEach(c => {
        const status = document.getElementById("status-" + c.id);
        const found = c.test(text);
        status.textContent = found ? "Indice repéré" : "À vérifier";
        status.classList.toggle("found", found);
      });
      const checked = Object.values(state.rubric).filter(Boolean).length;
      document.getElementById("writingScore").textContent = (checked*4) + " / 36";
      const btn = document.getElementById("finishWriting");
      btn.disabled = wc < 30;
      btn.title = wc < 30 ? "Ajoute encore quelques phrases pour atteindre 30 mots." : "";
    }
    function bindWriting() {
      const map = { "plan-place":"place", "plan-intro":"intro", "plan-opinion":"opinion", "plan-arg1":"arg1", "plan-arg2":"arg2", "plan-end":"end" };
      Object.entries(map).forEach(([dom,key]) => {
        const el = document.getElementById(dom);
        el.value = state.plan[key] || "";
        el.addEventListener("input", writePlanFromInputs);
        el.addEventListener("change", writePlanFromInputs);
      });
      updatePlaceSuggestion();
      document.getElementById("plan-place").addEventListener("change", updatePlaceSuggestion);
      document.getElementById("usePlaceIntro").addEventListener("click", () => {
        const place = places.find(p => p.key === document.getElementById("plan-place").value);
        if (!place) return;
        document.getElementById("plan-intro").value = place.intro;
        writePlanFromInputs();
        document.getElementById("plan-intro").focus();
      });
      const finalText = document.getElementById("finalText");
      finalText.value = state.draft || "";
      finalText.addEventListener("input", () => { state.draft = finalText.value; saveState(); updateWritingHints(); });
      document.querySelectorAll("[data-rubric]").forEach(box => box.addEventListener("change", () => {
        state.rubric[box.dataset.rubric] = box.checked;
        saveState(); updateWritingHints();
      }));
      document.getElementById("assemble").addEventListener("click", () => {
        writePlanFromInputs();
        const bits = [cleanEnd(state.plan.intro), cleanEnd(state.plan.opinion)];
        if (state.plan.arg1.trim()) bits.push("D’abord, " + cleanEnd(state.plan.arg1));
        if (state.plan.arg2.trim()) bits.push("Ensuite, " + cleanEnd(state.plan.arg2));
        bits.push(cleanEnd(state.plan.end));
        state.draft = bits.filter(Boolean).join(". ") + (bits.some(Boolean) ? "." : "");
        finalText.value = state.draft;
        saveState(); updateWritingHints();
        finalText.focus();
      });
      document.getElementById("finishWriting").addEventListener("click", () => {
        state.draft = finalText.value;
        state.page = "results";
        saveState(); render(); window.scrollTo(0,0);
      });
      document.getElementById("backToPractice").addEventListener("click", () => { state.step=0; state.question=0; state.page="stage"; saveState(); render(); window.scrollTo(0,0); });
      document.getElementById("homeButton").addEventListener("click", () => { state.page="home"; saveState(); render(); window.scrollTo(0,0); });
      updateWritingHints();
    }
    function resultsPage() {
      const objective = Object.keys(state.solved).length * 4;
      const writing = Object.values(state.rubric).filter(Boolean).length * 4;
      const passed = criteria.filter(c => state.rubric[c.id]);
      const review = criteria.filter(c => !state.rubric[c.id]);
      const wordTotal = words(state.draft).length;
      const score = Math.min(100, objective + writing);
      const message = score >= 85 ? "Ton carnet est prêt pour le voyage !" : score >= 65 ? "Ton guide prend forme : continue à préciser tes descriptions." : "Tu as déjà commencé ton guide. Les conseils ci-dessous t’aideront à l’améliorer.";
      return header() + '<main><div class="wrap"><section class="results-hero"><div class="eyebrow" style="color:#f0c77a">Bilan de mission</div><h1>Bravo, jeune guide !</h1><p>' + message + '</p><span class="results-score"><strong>' + score + '</strong> / 100 points</span></section><section class="results-grid"><article class="result-card"><div class="section-kicker">Tes réussites</div><h2>Ce que tu sais faire</h2><ul class="result-list">' + (passed.length ? passed.map(c => '<li><span class="tick">✓</span><span>' + safeText(c.label.replace(/^J’ai /,"Tu as ")) + '</span></li>').join("") : '<li><span class="tick">✓</span><span>Tu as parcouru les activités et commencé un paragraphe de ' + wordTotal + ' mots.</span></li>') + '<li><span class="tick">✓</span><span>Tu as réussi ' + Object.keys(state.solved).length + ' activités d’entraînement sur 16.</span></li></ul></article><article class="result-card"><div class="section-kicker">Pour progresser</div><h2>À revoir tranquillement</h2>' + (review.length ? '<ul class="result-list">' + review.map(c => '<li class="review"><span>↗</span><span><b>' + safeText(c.label) + '</b><br>' + safeText(c.tip) + '</span></li>').join("") + '</ul>' : '<p>Ta grille est complète. Relis encore une fois les accords et la ponctuation avant de partager ton texte.</p>') + '</article></section><section class="result-card"><div class="section-kicker">Ton texte</div><h2>Le paragraphe de ton guide</h2><p class="saved-writing" id="savedWriting"></p><p class="fineprint">Ton opinion n’est pas comparée à celle du modèle : un avis différent est accepté s’il est clair et justifié.</p></section><div class="result-actions"><button class="button secondary" id="copyText">Copier mon paragraphe</button><button class="button secondary" id="returnWriting">Revoir mon texte</button><button class="button clay" id="restart">Recommencer le voyage</button></div></div></main>' + footer();
    }
    function bindResults() {
      document.getElementById("savedWriting").textContent = state.draft || "Tu n’as pas encore saisi de paragraphe.";
      document.getElementById("copyText").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(state.draft || "");
          document.getElementById("copyText").textContent = "Paragraphe copié ✓";
        } catch (_) {
          document.getElementById("copyText").textContent = "Copie non disponible sur cet appareil";
        }
      });
      document.getElementById("returnWriting").addEventListener("click", () => { state.step=4; state.page="stage"; saveState(); render(); window.scrollTo(0,0); });
      document.getElementById("restart").addEventListener("click", () => {
        if (window.confirm("Recommencer effacera le score et le brouillon enregistrés sur cet appareil. Continuer ?")) {
          try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
          state = structuredClone(initialState); render(); window.scrollTo(0,0);
        }
      });
    }
    function render() {
      if (state.page === "home") document.getElementById("app").innerHTML = homePage();
      else if (state.page === "results") document.getElementById("app").innerHTML = resultsPage();
      else document.getElementById("app").innerHTML = stagePage();
      bindHeader();
      if (state.page === "home") bindHome();
      else if (state.page === "results") bindResults();
      else if (state.step === 4) bindWriting();
      else bindStage();
    }
    render();
  </script>
</body>
</html>
